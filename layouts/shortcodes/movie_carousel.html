{{- $group := .Get "group" -}}
{{- $movies := index site.Data.movies $group | default (slice) -}}

{{- if gt (len $movies) 0 -}}
<div class="flex gap-4 overflow-x-auto snap-x snap-mandatory pb-4">
  {{- range $movies }}
  <div class="snap-start">
    {{- if .poster }}
    <div class="mb-2 w-[180px] h-[270px] overflow-hidden rounded shadow">
      <img src="{{ .poster }}" alt="{{ .title }} poster" class="w-full h-full object-cover">
    </div>
    {{- end }}
    <div class="font-semibold w-[180px]">{{ .title }}</div>
    <div class="text-sm text-gray-400 dark:text-gray-400 w-[180px]">{{ .year }} · {{ .director }}</div>
  </div>
  {{- end }}
</div>
{{- else -}}
<p class="text-sm text-gray-400 dark:text-gray-500">No movies added yet.</p>
{{- end -}}
