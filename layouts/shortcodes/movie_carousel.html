{{- $group := .Get "group" -}}
{{- $movies := index site.Data.movies $group | default (slice) -}}

{{- if gt (len $movies) 0 -}}
<div class="flex gap-4 overflow-x-auto snap-x snap-mandatory pb-4">
  {{- range $movies }}
  <div class="snap-start flex-none">
    {{- if .poster }}
    <div class="mb-2 overflow-hidden rounded shadow flex items-center justify-center bg-black/10 dark:bg-white/5" style="width: 180px; height: 270px;">
      <img src="{{ .poster }}" alt="{{ .title }} poster" class="max-w-full max-h-full object-contain">
    </div>
    {{- end }}
    <div class="font-semibold" style="width: 180px;">{{ .title }}</div>
    <div class="text-sm text-gray-400 dark:text-gray-400" style="width: 180px;">{{ .year }} · {{ .director }}</div>
  </div>
  {{- end }}
</div>
{{- else -}}
<p class="text-sm text-gray-400 dark:text-gray-500">No movies added yet.</p>
{{- end -}}
